<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sliding Puzzle Game - BlueJ Lab</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: linear-gradient(135deg, #3b82f6, #1e40af);
      color: #fff;
    }
    .back-btn {
      flex: 0 0 auto;
      color: #1e40af;
      background: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 7px 12px;
      border-radius: 999px;
    }
    .topbar h1 { margin: 0; font-size: 17px; line-height: 1.2; flex: 1; min-width: 0; }
    .sound-btn {
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 17px;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }

    .layout { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

    /* Upper part: animation + output */
    .stage-panel {
      flex: 0 0 auto;
      background: radial-gradient(circle at 50% 35%, #1e3a5f 0%, #0f172a 75%);
      color: #e2e8f0;
      padding: 6px 10px 8px;
      position: relative;
      overflow: hidden;
    }
    .stage-svg { display: block; width: 100%; max-width: 820px; height: auto; margin: 0 auto; }

    .vars {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      margin: 2px 0 6px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
    }
    .vars span {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 6px;
      padding: 2px 6px;
    }
    .vars b { color: #fde047; }
    @media (max-width: 420px) {
      .vars { flex-wrap: nowrap; font-size: 11px; gap: 3px; }
      .vars span { padding: 2px 5px; white-space: nowrap; }
    }

    .ask-row { display: flex; gap: 8px; max-width: 520px; margin: 0 auto 6px; }
    .ask-row input {
      flex: 1;
      min-width: 0;
      font-size: 17px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 2px solid #3b82f6;
      background: #fff;
      color: #0f172a;
    }
    .ask-row button {
      border: 0;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #10b981, #047857);
      cursor: pointer;
    }
    .ask-row button:disabled { opacity: 0.55; cursor: not-allowed; }

    .terminal {
      max-width: 820px;
      margin: 0 auto;
      height: 74px;
      overflow-y: auto;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 10px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.45;
      color: #a7f3d0;
      white-space: pre-wrap;
    }
    .terminal .cursor { display: inline-block; width: 8px; background: #a7f3d0; animation: blink 1s steps(1) infinite; }
    .terminal .user { color: #fde047; }
    .terminal .ok { color: #4ade80; font-weight: 700; }
    .terminal .bad { color: #fca5a5; font-weight: 700; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Lower part: read-only program */
    .code-panel {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      background: #fffdf0;
      border-top: 4px solid #1e40af;
    }
    .code-title {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #fef3c7;
      border-bottom: 1px solid #fcd34d;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #92400e;
    }
    .code {
      margin: 0;
      padding: 6px 0 24px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13.5px;
      line-height: 1.6;
      user-select: text;
    }
    .code .ln {
      display: block;
      padding: 0 12px 0 0;
      white-space: pre;
      border-left: 4px solid transparent;
      transition: background 0.2s ease;
    }
    .code .ln::before {
      content: attr(data-n);
      display: inline-block;
      width: 32px;
      margin-right: 10px;
      text-align: right;
      color: #94a3b8;
    }
    .code .ln.active { background: #fde68a; border-left-color: #f59e0b; }
    .kw { color: #7c3aed; font-weight: 700; }
    .str { color: #047857; }
    .num { color: #c2410c; }
    .cm { color: #64748b; font-style: italic; }

    /* Pockets */
    .pocket rect.box { fill: #ffffff; stroke: #60a5fa; stroke-width: 3; transition: fill 0.3s ease, stroke 0.3s ease; }
    .pocket .flap { fill: none; stroke: #93c5fd; stroke-width: 2; stroke-dasharray: 5 4; }
    .pocket text.val {
      font: 700 26px "Segoe UI", Arial, sans-serif;
      fill: #0f172a;
      text-anchor: middle;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.3s ease;
    }
    .pocket text.idx { font: 600 14px Consolas, monospace; fill: #93c5fd; text-anchor: middle; }
    .pocket .mark { font: 700 22px Arial, sans-serif; fill: #dc2626; text-anchor: middle; opacity: 0; transition: opacity 0.3s ease; }
    .pocket.checking rect.box { fill: #fde047; stroke: #f59e0b; }
    .pocket.checking text.val { transform: scale(1.45); }
    .pocket.no rect.box { fill: #fecaca; stroke: #f87171; }
    .pocket.no .mark { opacity: 1; }
    .pocket.found rect.box { fill: #86efac; stroke: #16a34a; }
    .pocket.found text.val { transform: scale(1.3); }
    .pocket.found rect.box { filter: drop-shadow(0 0 10px #4ade80); }

    /* Cartoon teacher */
    #heroPos { transition: transform 0.65s linear; }
    #hero .part { transform-box: fill-box; }
    #hero .leg { transform-origin: 50% 0%; }
    #hero .arm { transform-origin: 50% 0%; transition: transform 0.35s ease; }
    #hero .head { transform-origin: 50% 100%; transition: transform 0.3s ease; }
    #hero .eyes { transform-origin: 50% 50%; animation: eyeBlink 4s infinite; }
    #hero .armL { transform: rotate(8deg); }
    #hero .armR { transform: rotate(-32deg); }
    #hero .body { animation: breathe 2.4s ease-in-out infinite; transform-box: fill-box; }

    #hero.walk .legL { animation: legSwing 0.33s ease-in-out infinite alternate; }
    #hero.walk .legR { animation: legSwing 0.33s ease-in-out infinite alternate-reverse; }
    #hero.walk .armL { animation: armSwing 0.33s ease-in-out infinite alternate; }
    #hero.walk .body { animation: walkBob 0.33s ease-in-out infinite alternate; }

    #hero.inspect .armR { transform: rotate(-178deg); }
    #hero.inspect .armL { transform: rotate(18deg); }
    #hero.inspect .head { transform: rotate(-6deg); }

    #hero.shake .head { animation: headShake 0.7s ease-in-out; }
    #hero.shake .armR { transform: rotate(-60deg); }

    #hero.jump .body { animation: jump 0.42s ease-out infinite alternate; }
    #hero.jump .armL { transform: rotate(158deg); }
    #hero.jump .armR { transform: rotate(-158deg); }
    #hero.jump .legL { animation: legSwing 0.21s ease-in-out infinite alternate; }
    #hero.jump .legR { animation: legSwing 0.21s ease-in-out infinite alternate-reverse; }

    #hero.sad .head { transform: translateY(4px) rotate(10deg); }
    #hero.sad .armL { transform: rotate(2deg); }
    #hero.sad .armR { transform: rotate(-6deg); }
    #hero.sad .mouth { transform: translateY(6px) scaleY(-1); transform-box: fill-box; transform-origin: center; }

    @keyframes legSwing { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
    @keyframes armSwing { from { transform: rotate(-26deg); } to { transform: rotate(30deg); } }
    @keyframes walkBob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes jump { from { transform: translateY(0); } to { transform: translateY(-34px); } }
    @keyframes headShake {
      0%, 100% { transform: rotate(0); }
      20% { transform: rotate(-13deg); }
      40% { transform: rotate(13deg); }
      60% { transform: rotate(-11deg); }
      80% { transform: rotate(9deg); }
    }
    @keyframes eyeBlink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }

    .bubble rect { fill: #ffffff; stroke: #1e40af; stroke-width: 2; }
    .bubble path { fill: #ffffff; stroke: #1e40af; stroke-width: 2; }
    .bubble text { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }

    .confetti {
      position: absolute;
      top: -12px;
      width: 9px;
      height: 14px;
      border-radius: 2px;
      pointer-events: none;
      animation: fall 1.9s ease-in forwards;
    }
    @keyframes fall {
      to { transform: translate(var(--dx), 420px) rotate(var(--rot)); opacity: 0.2; }
    }

    @media (min-width: 980px) {
      .layout { flex-direction: row; }
      .stage-panel { flex: 1 1 58%; display: flex; flex-direction: column; justify-content: center; }
      .terminal { height: 150px; width: 100%; }
      .code-panel { flex: 1 1 42%; border-top: 0; border-left: 4px solid #1e40af; }
    }

    @media (prefers-reduced-motion: reduce) {
      #heroPos { transition-duration: 0.2s; }
    }
  
    .stage-panel {
      background:
        linear-gradient(rgba(15, 23, 42, 0.78), rgba(15, 23, 42, 0.9)),
        url("school.jpg") center / cover no-repeat;
    }
    .credits { text-align: center; line-height: 1.1; margin: 2px 0 6px; font-family: Arial, sans-serif; }
    .credits .l1 { color: #f87171; font-size: 14px; font-weight: 700; }
    .credits .l2 { color: #4ade80; font-size: 20px; font-weight: 800; }
    .play-row { display: flex; align-items: flex-end; justify-content: center; gap: 6px; }
    .board {
      position: relative;
      width: min(62vw, 34vh, 330px);
      aspect-ratio: 1;
      background: #1e293b;
      border: 4px solid #334155;
      border-radius: 12px;
      touch-action: manipulation;
    }
    .tile {
      position: absolute;
      top: 0;
      left: 0;
      width: 25%;
      height: 25%;
      padding: 3px;
      transition: transform 0.16s ease-out;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tile span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 9px;
      font: 800 clamp(18px, 6vw, 34px) Arial, sans-serif;
      color: #fff;
      background: linear-gradient(145deg, #60a5fa, #1d4ed8);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25), 0 2px 4px rgba(0,0,0,0.3);
      user-select: none;
    }
    .tile.home span { background: linear-gradient(145deg, #4ade80, #15803d); }
    .tile.nope span { animation: nope 0.3s ease; }
    @keyframes nope { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .board.won { border-color: #4ade80; box-shadow: 0 0 22px rgba(74, 222, 128, 0.6); }
    .hero-box { width: min(26vw, 120px); flex: 0 0 auto; }
    .hero-box svg { display: block; width: 100%; height: auto; }
    .say {
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      color: #0f172a;
      background: #fff;
      border: 2px solid #1e40af;
      border-radius: 12px;
      padding: 4px 10px;
      margin: 6px auto;
      width: fit-content;
      max-width: 95%;
    }
    .puzzle-controls { display: flex; justify-content: center; gap: 8px; margin: 4px 0 6px; flex-wrap: wrap; }
    .puzzle-controls button {
      border: 0;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #10b981, #047857);
      cursor: pointer;
    }
    .puzzle-controls .alt { background: linear-gradient(135deg, #6366f1, #4338ca); }
    .terminal { height: 54px; }
    #hero.nod .head { animation: headNod 0.6s ease-in-out; }
    @keyframes headNod {
      0%, 100% { transform: translateY(0) rotate(0); }
      25% { transform: translateY(4px) rotate(3deg); }
      75% { transform: translateY(4px) rotate(3deg); }
    }
    @media (min-width: 980px) {
      .board { width: min(40vw, 60vh, 420px); }
      .terminal { height: 110px; }
    }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back-btn" href="index.html" aria-label="Back to all topics">&larr; Back</a>
    <h1>23. Sliding Puzzle</h1>
    <button class="sound-btn" id="soundBtn" type="button" aria-label="Turn sound off" title="Sound on/off">&#128266;</button>
  </div>

  <div class="layout">
    <section class="stage-panel" aria-label="Sliding puzzle game">
      <div class="credits">
        <div class="l1">Program developed by:</div>
        <div class="l2">Susanto Ganguly</div>
      </div>

      <div class="play-row">
        <div class="board" id="board" role="grid" aria-label="4 by 4 sliding puzzle"></div>
        <div class="hero-box" aria-hidden="true">
          <svg viewBox="-78 140 170 240">
            <defs>
          <radialGradient id="lensGlass" cx="35%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.35" />
          </radialGradient>
        </defs>
            <g transform="translate(0,370) scale(1.25)">

              <g class="body">
                <g class="part leg legL">

                  <ellipse cx="-11" cy="-3" rx="11" ry="5" fill="#111827" />
                </g>
                <g class="part leg legR">
                  <rect x="3" y="-46" width="12" height="42" rx="4" fill="#1d4ed8" />
                  <ellipse cx="11" cy="-3" rx="11" ry="5" fill="#111827" />
                </g>

                <rect x="-25" y="-101" width="50" height="60" rx="15" fill="#a5d8f3" />
                <path d="M-11 -101 L0 -89 L11 -101 Z" fill="#ffffff" />
                <path d="M-12 -101 L-3 -91 L-9 -86 Z M12 -101 L3 -91 L9 -86 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
                <circle cx="0" cy="-78" r="2" fill="#7dd3fc" />
                <circle cx="0" cy="-66" r="2" fill="#7dd3fc" />

                <g class="part arm armL">
                  <rect x="-33" y="-97" width="13" height="44" rx="6.5" fill="#bae6fd" />
                  <circle cx="-26.5" cy="-50" r="7" fill="#f2b48a" />
                </g>

                <g class="part arm armR">
                  <rect x="20" y="-97" width="13" height="44" rx="6.5" fill="#bae6fd" />
                  <circle cx="26.5" cy="-50" r="7" fill="#f2b48a" />
                  <rect x="23.5" y="-45" width="6" height="34" rx="3" fill="#92400e" />
                  <circle cx="26.5" cy="11" r="21" fill="url(#lensGlass)" stroke="#475569" stroke-width="5" />

                  <path d="M-31 -130 C-34 -160 -14 -170 0 -169 C16 -170 34 -160 31 -130 C27 -140 22 -146 14 -148 C4 -150 -10 -150 -18 -147 C-24 -144 -28 -138 -31 -130 Z" fill="#1f2a37" />
                  <ellipse cx="-27" cy="-140" rx="7" ry="11" fill="#1f2a37" />

                  <rect x="-21" y="-137" width="17" height="13" rx="4" fill="rgba(255,255,255,0.35)" stroke="#334155" stroke-width="2" />

        </div>
      </div>

      <div class="say" id="say">Tap a tile next to the empty space!</div>

      <div class="vars">
        <span>moves = <b id="vMoves">0</b></span>
        <span>emptyRow = <b id="vRow">-</b></span>
        <span>emptyCol = <b id="vCol">-</b></span>
        <span>time = <b id="vTime">0:00</b></span>

      <div class="puzzle-controls">
        <button id="shuffleBtn" type="button">Shuffle / New Game</button>

      <div class="terminal" id="terminal" aria-live="polite"></div>

    <section class="code-panel" id="codePanel" aria-label="Java program (read only)">
      <div class="code-title">SlidingPuzzleFX.java (BlueJ + JavaFX) &middot; read only &middot; scroll to read</div>
      <pre class="code" id="code"></pre>
    </section>
  </div>

  <script>
    (function () {
      const SIZE = 4;
      const JAVA = ["import javafx.application.Application;", "import javafx.geometry.Pos;", "import javafx.scene.Scene;", "import javafx.scene.control.Button;", "import javafx.scene.control.Label;", "import javafx.scene.layout.BorderPane;", "import javafx.scene.layout.GridPane;", "import javafx.scene.layout.VBox;", "import javafx.scene.paint.Color;", "import javafx.scene.text.Font;", "import javafx.stage.Stage;", "import java.util.Arrays;", "import java.util.Collections;", "", "public class SlidingPuzzleFX extends Application {", "    private final int SIZE = 4; // 4x4 grid", "    private Button[][] buttons;", "    private int[][] board;", "    private int emptyRow, emptyCol;", "", "    @Override", "    public void start(Stage primaryStage) {", "        primaryStage.setTitle(\"Sliding Puzzle Game\");", "", "        // Label for the first line (red)", "        Label label1 = new Label(\"Program developed by:\");", "        label1.setFont(new Font(\"Arial\", 30));", "        label1.setTextFill(Color.RED);", "", "        // Label for the second line (green)", "        Label label2 = new Label(\"Susanto Ganguly\");", "        label2.setFont(new Font(\"Arial\", 40));", "        label2.setTextFill(Color.GREEN);", "", "        // VBox to hold the labels and align them in the center", "        VBox vbox = new VBox();", "        vbox.setAlignment(Pos.CENTER); // Center the labels horizontally", "        vbox.getChildren().addAll(label1, label2);", "", "        // GridPane to hold the puzzle buttons", "        GridPane grid = new GridPane();", "        buttons = new Button[SIZE][SIZE];", "        board = new int[SIZE][SIZE];", "", "        initBoard();", "        createButtons(grid);", "        shuffleBoard();", "", "        // BorderPane to place the labels at the top and the grid in the center", "        BorderPane root = new BorderPane();", "        root.setTop(vbox); // Add the VBox (labels) to the top of the window", "        root.setCenter(grid); // Add the GridPane (puzzle) to the center of the window", "        BorderPane.setAlignment(vbox, Pos.TOP_CENTER); // Align the labels at the top center", "", "        // Create the scene with the BorderPane", "        Scene scene = new Scene(root, 400, 450); // Adjusted height to fit the labels and buttons", "        primaryStage.setScene(scene);", "        primaryStage.show();", "    }", "", "    private void initBoard() {", "        int num = 1;", "        for (int i = 0; i < SIZE; i++) {", "            for (int j = 0; j < SIZE; j++) {", "                if (num < SIZE * SIZE) {", "                    board[i][j] = num++;", "                } else {", "                    board[i][j] = 0; // 0 represents the empty tile", "                    emptyRow = i;", "                    emptyCol = j;", "                }", "            }", "        }", "    }", "", "    private void createButtons(GridPane grid) {", "        for (int i = 0; i < SIZE; i++) {", "            for (int j = 0; j < SIZE; j++) {", "                Button btn = new Button();", "                btn.setFont(new Font(\"Arial\", 30));", "                btn.setPrefSize(100, 100);", "                int row = i, col = j; // needed to pass to the lambda expression", "                btn.setOnAction(e -> moveTile(row, col));", "                buttons[i][j] = btn;", "                updateButton(i, j);", "                grid.add(btn, j, i);", "            }", "        }", "    }", "", "    private void updateButton(int row, int col) {", "        if (board[row][col] == 0) {", "            buttons[row][col].setText(\"\");", "        } else {", "            buttons[row][col].setText(String.valueOf(board[row][col]));", "        }", "    }", "", "    private void shuffleBoard() {", "        Integer[] nums = new Integer[SIZE * SIZE];", "        for (int i = 0; i < SIZE * SIZE; i++) {", "            nums[i] = i;", "        }", "        Collections.shuffle(Arrays.asList(nums));", "        for (int i = 0; i < SIZE; i++) {", "            for (int j = 0; j < SIZE; j++) {", "                board[i][j] = nums[i * SIZE + j];", "                if (board[i][j] == 0) {", "                    emptyRow = i;", "                    emptyCol = j;", "                }", "                updateButton(i, j);", "            }", "        }", "    }", "", "    private void moveTile(int row, int col) {", "        if ((Math.abs(emptyRow - row) == 1 && emptyCol == col) ||", "            (Math.abs(emptyCol - col) == 1 && emptyRow == row)) {", "            board[emptyRow][emptyCol] = board[row][col];", "            board[row][col] = 0;", "            emptyRow = row;", "            emptyCol = col;", "            updateButtons();", "            if (isSolved()) {", "                System.out.println(\"Congratulations! You've solved the puzzle.\");", "            }", "        }", "    }", "", "    private void updateButtons() {", "        for (int i = 0; i < SIZE; i++) {", "            for (int j = 0; j < SIZE; j++) {", "                updateButton(i, j);", "            }", "        }", "    }", "", "    private boolean isSolved() {", "        int num = 1;", "        for (int i = 0; i < SIZE; i++) {", "            for (int j = 0; j < SIZE; j++) {", "                if (i == SIZE - 1 && j == SIZE - 1) {", "                    return board[i][j] == 0;", "                }", "                if (board[i][j] != num++) {", "                    return false;", "                }", "            }", "        }", "        return true;", "    }", "", "    public static void main(String[] args) {", "        launch(args);", "    }", "}"];
      const LINE = {"shuffleCall": 47, "shuffle": 104, "click": 83, "check": 118, "swap1": 120, "update": 124, "solvedIf": 125, "congrats": 126};

      const boardEl = document.getElementById('board');
      const hero = document.getElementById('hero');
      const sayEl = document.getElementById('say');
      const terminal = document.getElementById('terminal');
      const codeEl = document.getElementById('code');
      const codePanel = document.getElementById('codePanel');
      const stagePanel = document.querySelector('.stage-panel');
      const soundBtn = document.getElementById('soundBtn');
      const vMoves = document.getElementById('vMoves');
      const vRow = document.getElementById('vRow');
      const vCol = document.getElementById('vCol');
      const vTime = document.getElementById('vTime');

      // ---------- Read-only code panel ----------
      function escapeHTML(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function highlightJava(line) {
        return escapeHTML(line).replace(
          /(\/\/.*$)|("(?:[^"\\]|\\.)*")|\b(import|public|private|static|final|class|extends|void|int|boolean|new|for|if|else|return|true|false|Override)\b|\b(\d+)\b/g,
          (m, cm, str, kw, num) => {
            if (cm) return '<span class="cm">' + cm + '</span>';
            if (str) return '<span class="str">' + str + '</span>';
            if (kw) return '<span class="kw">' + kw + '</span>';
            return '<span class="num">' + num + '</span>';
          }
        );
      }
      codeEl.innerHTML = JAVA.map((l, i) =>
        '<span class="ln" data-n="' + (i + 1) + '" id="L' + (i + 1) + '">' + (highlightJava(l) || ' ') + '</span>'
      ).join('');

      let lastUserScroll = 0;
      ['touchstart', 'wheel', 'mousedown'].forEach((evt) =>
        codePanel.addEventListener(evt, () => { lastUserScroll = Date.now(); }, { passive: true })
      );
      function markLine(n) {
        codeEl.querySelectorAll('.ln.active').forEach((el) => el.classList.remove('active'));
        const el = document.getElementById('L' + n);
        if (!el) return;
        el.classList.add('active');
        if (Date.now() - lastUserScroll > 4000) {
          codePanel.scrollTo({ top: Math.max(0, el.offsetTop - codePanel.clientHeight / 2), behavior: 'smooth' });
        }
      }

      // ---------- Sound ----------
      let audioCtx = null;
      let soundOn = true;
      function tone(freq, start, dur, type, vol) {
        if (!soundOn) return;
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime + start;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.05);
      }
      const sfx = {
        slide() { tone(420, 0, 0.07, 'triangle', 0.08); },
        nope() { tone(200, 0, 0.12, 'square', 0.05); },
        shuffle() { for (let k = 0; k < 6; k++) tone(300 + k * 60, k * 0.05, 0.05, 'triangle', 0.06); },
        win() { [523, 659, 784, 1047, 784, 1047].forEach((f, k) => tone(f, k * 0.12, 0.2, 'triangle', 0.14)); }
      };
      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.innerHTML = soundOn ? '&#128266;' : '&#128263;';
      });

      // ---------- Cartoon ----------
      let heroTimer = null;
      function heroDo(state, ms) {
        clearTimeout(heroTimer);
        hero.setAttribute('class', state);
        if (ms) heroTimer = setTimeout(() => hero.setAttribute('class', ''), ms);
      }
      function say(text) { sayEl.textContent = text; }
      function printLine(html) {
        terminal.insertAdjacentHTML('beforeend', html + '\n');
        terminal.scrollTop = terminal.scrollHeight;
      }
      function confetti() {
        const colors = ['#f43f5e', '#f59e0b', '#22c55e', '#3b82f6', '#a855f7', '#fde047'];
        for (let k = 0; k < 50; k++) {
          const c = document.createElement('div');
          c.className = 'confetti';
          c.style.left = Math.random() * 100 + '%';
          c.style.background = colors[k % colors.length];
          c.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
          c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
          c.style.animationDelay = (Math.random() * 0.6) + 's';
          stagePanel.appendChild(c);
          setTimeout(() => c.remove(), 2800);
        }
      }

      // ---------- Game (same rules as the program) ----------
      let board = [];
      let emptyRow = SIZE - 1, emptyCol = SIZE - 1;
      let moves = 0, won = false;
      let startTime = 0, clock = null;
      const tiles = {};

      for (let n = 1; n < SIZE * SIZE; n++) {
        const t = document.createElement('div');
        t.className = 'tile';
        t.setAttribute('role', 'button');
        t.innerHTML = '<span>' + n + '</span>';
        t.addEventListener('click', () => {
          const pos = findTile(n);
          moveTile(pos.row, pos.col);
        });
        boardEl.appendChild(t);
        tiles[n] = t;
      }

      function findTile(n) {
        for (let i = 0; i < SIZE; i++)
          for (let j = 0; j < SIZE; j++)
            if (board[i][j] === n) return { row: i, col: j };
        return null;
      }

      function updateButtons() {
        for (let i = 0; i < SIZE; i++) {
          for (let j = 0; j < SIZE; j++) {
            const n = board[i][j];
            if (!n) continue;
            const t = tiles[n];
            t.style.transform = 'translate(' + j * 100 + '%,' + i * 100 + '%)';
            t.classList.toggle('home', n === i * SIZE + j + 1);
          }
        }
        vMoves.textContent = moves;
        vRow.textContent = emptyRow;
        vCol.textContent = emptyCol;
      }

      function isSolved() {
        let num = 1;
        for (let i = 0; i < SIZE; i++) {
          for (let j = 0; j < SIZE; j++) {
            if (i === SIZE - 1 && j === SIZE - 1) return board[i][j] === 0;
            if (board[i][j] !== num++) return false;
          }
        }
        return true;
      }

      function tick() {
        const s = Math.floor((Date.now() - startTime) / 1000);
        vTime.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      }

      function moveTile(row, col) {
        if (won) return;
        markLine(LINE.click);
        const t = tiles[board[row][col]];
        if ((Math.abs(emptyRow - row) === 1 && emptyCol === col) ||
            (Math.abs(emptyCol - col) === 1 && emptyRow === row)) {
          markLine(LINE.swap1);
          board[emptyRow][emptyCol] = board[row][col];
          board[row][col] = 0;
          emptyRow = row;
          emptyCol = col;
          moves++;
          if (!clock) { startTime = Date.now(); clock = setInterval(tick, 1000); }
          updateButtons();
          sfx.slide();
          if (moves % 5 === 0) heroDo('nod', 650);
          say(['Good move!', 'Keep going!', 'Nice slide!', 'Think ahead...', 'You can do it!'][moves % 5]);
          setTimeout(() => markLine(LINE.update), 150);
          if (isSolved()) {
            won = true;
            clearInterval(clock);
            clock = null;
            tick();
            setTimeout(() => markLine(LINE.congrats), 350);
            boardEl.classList.add('won');
            printLine('<span class="ok">Congratulations! You\'ve solved the puzzle.</span>');
            printLine('Moves: ' + moves + '   Time: ' + vTime.textContent);
            say('You solved it! \u{1F389}');
            heroDo('jump', 3000);
            sfx.win();
            confetti();
          }
        } else {
          markLine(LINE.check);
          if (t) {
            t.classList.remove('nope');
            void t.offsetWidth;
            t.classList.add('nope');
          }
          sfx.nope();
          heroDo('shake', 700);
          say('That tile cannot move - pick one next to the gap');
        }
      }

      // Shuffle by making random legal moves from the solved board, so the
      // puzzle is always solvable (a random arrangement is unsolvable half the time).
      function newGame(shuffleMoves) {
        markLine(LINE.shuffleCall);
        board = [];
        let num = 1;
        for (let i = 0; i < SIZE; i++) {
          board.push([]);
          for (let j = 0; j < SIZE; j++) board[i].push(num < SIZE * SIZE ? num++ : 0);
        }
        emptyRow = SIZE - 1;
        emptyCol = SIZE - 1;
        let prev = null;
        for (let k = 0; k < shuffleMoves; k++) {
          const options = [[1, 0], [-1, 0], [0, 1], [0, -1]]
            .map(([dr, dc]) => [emptyRow + dr, emptyCol + dc])
            .filter(([r, c]) => r >= 0 && r < SIZE && c >= 0 && c < SIZE && !(prev && prev[0] === r && prev[1] === c));
          const [r, c] = options[Math.floor(Math.random() * options.length)];
          board[emptyRow][emptyCol] = board[r][c];
          board[r][c] = 0;
          prev = [emptyRow, emptyCol];
          emptyRow = r;
          emptyCol = c;
        }
        if (isSolved()) return newGame(shuffleMoves);
        moves = 0;
        won = false;
        clearInterval(clock);
        clock = null;
        vTime.textContent = '0:00';
        boardEl.classList.remove('won');
        updateButtons();
        terminal.innerHTML = '';
        printLine(shuffleMoves < 50 ? 'Easy board ready - only a few tiles are mixed.' : 'Board shuffled. Arrange 1 to 15 in order!');
        heroDo('walk', 900);
        setTimeout(() => markLine(LINE.shuffle), 200);
      }

      document.getElementById('shuffleBtn').addEventListener('click', () => {
        sfx.shuffle();
        newGame(250);
        say('New game! Order: 1 to 15, gap at the end');
      });
      document.getElementById('easyBtn').addEventListener('click', () => {
        sfx.shuffle();
        newGame(12);
        say('Easy game - try to solve it!');
      });

      newGame(250);
    })();
  </script>
</body>
</html>
